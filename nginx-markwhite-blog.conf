# Install as /etc/nginx/sites-available/markwhite-blog and enable it.
server {
    listen 80;
    listen [::]:80;
    server_name markwhite.cn www.markwhite.cn;

    # Keep this path available for automatic Let's Encrypt renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www;
    }

    location = /blog {
        return 301 https://$host/blog/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name markwhite.cn www.markwhite.cn;

    ssl_certificate /etc/letsencrypt/live/markwhite.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markwhite.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /blog/index.html;
    }
}
