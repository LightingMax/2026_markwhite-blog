name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: blog-out
          path: out

  deploy:
    needs: build
    if: ${{ github.repository == 'LightingMax/2026_markwhite-blog' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blog-out
          path: out
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.BLOG_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.BLOG_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BLOG_DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/blog_deploy
          chmod 600 ~/.ssh/blog_deploy
          timeout 20 ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          stage_path="/tmp/markwhite-blog-${GITHUB_RUN_ID}"
          ssh_opts="-i ~/.ssh/blog_deploy -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          timeout 15m rsync -a --delete --partial --timeout=60 -e "ssh $ssh_opts" out/ "$DEPLOY_USER@$DEPLOY_HOST:$stage_path/"
          timeout 2m ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "sudo mv /var/www/blog /var/www/blog.previous-${GITHUB_RUN_ID}; sudo mv $stage_path /var/www/blog; sudo chown -R root:root /var/www/blog; sudo nginx -t; sudo systemctl reload nginx"
